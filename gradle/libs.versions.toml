[versions]
agp = "9.0.1"
kotlin = "2.3.10"
detekt = "1.23.7"
compose-bom = "2026.02.01"
activity-compose = "1.12.4"
redbytefx = "1.1.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
redbytefx-core = { module = "io.github.i-redbyte:redbytefx-core", version.ref = "redbytefx" }
redbytefx-gl = { module = "io.github.i-redbyte:redbytefx-gl", version.ref = "redbytefx" }
redbytefx-gl-compose = { module = "io.github.i-redbyte:redbytefx-gl-compose", version.ref = "redbytefx" }
redbytefx-three-d = { module = "io.github.i-redbyte:redbytefx-3d", version.ref = "redbytefx" }
redbytefx-stdlib = { module = "io.github.i-redbyte:redbytefx-stdlib", version.ref = "redbytefx" }
